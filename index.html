<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Thumbnail Studio</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .studio-container { max-width: 1440px; margin: 0 auto; }
    h1 { margin: 0 0 16px 0; font-size: 1.4rem; color: #38bdf8; }

    /* Layout */
    .app-layout { display: grid; grid-template-columns: 440px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 1024px) { .app-layout { grid-template-columns: 1fr; } }

    /* Controls */
    .sidebar-controls { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1e293b; border-radius: 8px; border: 1px solid #334155; padding: 14px; }
    .card-title { font-size: 0.9rem; font-weight: 700; color: #f1f5f9; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full-width { grid-column: span 2; }

    /* Form Elements */
    label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; color: #94a3b8; }
    select, input[type="text"], input[type="file"], input[type="range"], input[type="color"] { 
      width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; height: 36px; font-size: 0.85rem; 
    }
    input[type="color"] { padding: 2px; cursor: pointer; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; height: 36px; background: #0f172a; padding: 6px 10px; border-radius: 6px; border: 1px solid #475569; cursor: pointer; }
    .checkbox-wrap input { width: auto; height: auto; }
    .checkbox-wrap span { font-size: 0.8rem; font-weight: 600; color: #f8fafc; }

    /* Preview Box */
    .preview-column { 
      background: #1e293b; 
      border-radius: 8px; 
      border: 1px solid #334155; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      position: sticky;
      top: 16px;
    }
    .status-bar { background: #020617; border: 1px solid #38bdf8; color: #38bdf8; font-family: monospace; font-size: 0.8rem; padding: 8px 12px; border-radius: 6px; }
    .canvas-container { 
      background: #020617; 
      border: 2px dashed #475569; 
      border-radius: 6px; 
      padding: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 360px;
    }
    canvas { 
      display: block; 
      width: 100%; 
      max-width: 100%; 
      height: auto; 
      border-radius: 4px; 
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    /* Stats & Buttons */
    .stats-row { display: flex; justify-content: space-between; background: #0f172a; padding: 8px 14px; border-radius: 6px; border: 1px solid #334155; font-size: 0.8rem; }
    .stat-val { color: #4ade80; font-weight: bold; }
    .btn { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 0.95rem; }
    .btn:hover { background: #0369a1; }
    .btn-sm { background: #475569; color: #f8fafc; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
  </style>
</head>
<body>

<div class="studio-container">
  <h1>YouTube Thumbnail Studio</h1>

  <div class="app-layout">
    <!-- CONTROLS -->
    <div class="sidebar-controls">
      
      <!-- 1. Background -->
      <div class="card">
        <div class="card-title">1. Base Background & Framing</div>
        <div class="card-grid">
          <div class="full-width">
            <label>Background Image</label>
            <input type="file" id="imageInput" accept="image/*">
          </div>
          <div>
            <label>Resolution Preset</label>
            <select id="resPreset">
              <option value="1280x720">Standard HD (1280 × 720)</option>
              <option value="1920x1080">Full HD (1920 × 1080)</option>
            </select>
          </div>
          <div>
            <label>Safe-Zone UI Guide</label>
            <label class="checkbox-wrap">
              <input type="checkbox" id="safeZoneToggle" checked>
              <span>Show Guide</span>
            </label>
          </div>
          <div class="full-width">
            <label>Zoom: <span id="bgZoomLabel">100%</span></label>
            <input type="range" id="bgZoom" min="100" max="300" value="100">
          </div>
          <div>
            <label>Pan X: <span id="bgPanXLabel">50%</span></label>
            <input type="range" id="bgPanX" min="0" max="100" value="50">
          </div>
          <div>
            <label>Pan Y: <span id="bgPanYLabel">50%</span></label>
            <input type="range" id="bgPanY" min="0" max="100" value="50">
          </div>
        </div>
      </div>

      <!-- 2. Enhancements -->
      <div class="card">
        <div class="card-title">
          <span>2. Image Enhancements</span>
          <button type="button" class="btn-sm" id="resetFiltersBtn">Reset</button>
        </div>
        <div class="card-grid">
          <div>
            <label>Brightness: <span id="brightLabel">100%</span></label>
            <input type="range" id="brightSlider" min="30" max="180" value="100">
          </div>
          <div>
            <label>Contrast: <span id="contrastLabel">100%</span></label>
            <input type="range" id="contrastSlider" min="50" max="200" value="100">
          </div>
          <div class="full-width">
            <label>Saturation: <span id="saturateLabel">100%</span></label>
            <input type="range" id="saturateSlider" min="0" max="250" value="100">
          </div>
        </div>
      </div>

      <!-- 3. Cutout -->
      <div class="card">
        <div class="card-title">
          <span>3. Foreground Cutout (PNG)</span>
          <button type="button" class="btn-sm" id="clearCutoutBtn">Clear</button>
        </div>
        <div class="card-grid">
          <div class="full-width">
            <label>Cutout Image</label>
            <input type="file" id="cutoutInput" accept="image/*">
          </div>
          <div>
            <label>Scale: <span id="cutoutScaleLabel">100%</span></label>
            <input type="range" id="cutoutScale" min="20" max="200" value="100">
          </div>
          <div>
            <label>Position X%: <span id="cutoutPosXLabel">75%</span></label>
            <input type="range" id="cutoutPosX" min="0" max="100" value="75">
          </div>
          <div>
            <label>Position Y%: <span id="cutoutPosYLabel">50%</span></label>
            <input type="range" id="cutoutPosY" min="0" max="100" value="50">
          </div>
          <div>
            <label>Mirror</label>
            <label class="checkbox-wrap">
              <input type="checkbox" id="cutoutFlipX">
              <span>Flip X</span>
            </label>
          </div>
          <div>
            <label>Glow Color</label>
            <input type="color" id="glowColor" value="#38bdf8">
          </div>
          <div>
            <label>Glow Blur: <span id="glowBlurLabel">25px</span></label>
            <input type="range" id="glowBlur" min="0" max="60" value="25">
          </div>
        </div>
      </div>

      <!-- 4. Text Line 1 -->
      <div class="card">
        <div class="card-title">4. Headline (Line 1)</div>
        <div class="card-grid">
          <div class="full-width">
            <label>Text Content</label>
            <input type="text" id="textLine1" placeholder="Leave empty or type headline...">
          </div>
          <div>
            <label>Size: <span id="fontSizeLabel1">80px</span></label>
            <input type="range" id="fontSize1" min="30" max="220" value="80">
          </div>
          <div>
            <label>Fill Color</label>
            <input type="color" id="fillColor1" value="#ffffff">
          </div>
          <div>
            <label>Outline Width: <span id="strokeWidthLabel1">12px</span></label>
            <input type="range" id="strokeWidth1" min="0" max="40" value="12">
          </div>
          <div>
            <label>Position X%: <span id="posXLabel1">35%</span></label>
            <input type="range" id="posX1" min="5" max="95" value="35">
          </div>
          <div>
            <label>Position Y%: <span id="posYLabel1">45%</span></label>
            <input type="range" id="posY1" min="5" max="95" value="45">
          </div>
          <div>
            <label>Angle: <span id="angleLabel1">-4°</span></label>
            <input type="range" id="angle1" min="-25" max="25" value="-4">
          </div>
          <div>
            <label>Highlight Box</label>
            <label class="checkbox-wrap">
              <input type="checkbox" id="badgeToggle1" checked>
              <span>Enable</span>
            </label>
          </div>
          <div>
            <label>Box Color</label>
            <input type="color" id="badgeColor1" value="#dc2626">
          </div>
        </div>
      </div>

      <!-- 5. Text Line 2 -->
      <div class="card">
        <div class="card-title">5. Subheader (Line 2)</div>
        <div class="card-grid">
          <div class="full-width">
            <label>Text Content</label>
            <input type="text" id="textLine2" placeholder="Leave empty or type subheader...">
          </div>
          <div>
            <label>Size: <span id="fontSizeLabel2">105px</span></label>
            <input type="range" id="fontSize2" min="30" max="220" value="105">
          </div>
          <div>
            <label>Fill Color</label>
            <input type="color" id="fillColor2" value="#ffeb3b">
          </div>
          <div>
            <label>Outline Width: <span id="strokeWidthLabel2">14px</span></label>
            <input type="range" id="strokeWidth2" min="0" max="40" value="14">
          </div>
          <div>
            <label>Position X%: <span id="posXLabel2">35%</span></label>
            <input type="range" id="posX2" min="5" max="95" value="35">
          </div>
          <div>
            <label>Position Y%: <span id="posYLabel2">65%</span></label>
            <input type="range" id="posY2" min="5" max="95" value="65">
          </div>
          <div>
            <label>Angle: <span id="angleLabel2">-4°</span></label>
            <input type="range" id="angle2" min="-25" max="25" value="-4">
          </div>
          <div>
            <label>Highlight Box</label>
            <label class="checkbox-wrap">
              <input type="checkbox" id="badgeToggle2">
              <span>Enable</span>
            </label>
          </div>
          <div>
            <label>Box Color</label>
            <input type="color" id="badgeColor2" value="#000000">
          </div>
        </div>
      </div>

    </div>

    <!-- PREVIEW -->
    <div class="preview-column">
      <div id="statusBox" class="status-bar">Status: Ready.</div>

      <div class="canvas-container">
        <canvas id="outputCanvas" width="1280" height="720"></canvas>
      </div>

      <div class="stats-row">
        <div>Resolution: <span class="stat-val" id="resVal">1280 × 720</span></div>
        <div>File Size: <span class="stat-val" id="sizeVal">-</span></div>
      </div>

      <button class="btn" id="downloadBtn">Download Thumbnail</button>
    </div>
  </div>
</div>

<script>
  const statusBox = document.getElementById('statusBox');
  function log(msg) { statusBox.textContent = `Status: ${msg}`; }

  const canvas = document.getElementById('outputCanvas');
  const ctx = canvas.getContext('2d');
  const resPreset = document.getElementById('resPreset');
  const safeZoneToggle = document.getElementById('safeZoneToggle');
  const resVal = document.getElementById('resVal');
  const sizeVal = document.getElementById('sizeVal');
  const downloadBtn = document.getElementById('downloadBtn');

  // Background
  const imageInput = document.getElementById('imageInput');
  const bgZoom = document.getElementById('bgZoom');
  const bgZoomLabel = document.getElementById('bgZoomLabel');
  const bgPanX = document.getElementById('bgPanX');
  const bgPanXLabel = document.getElementById('bgPanXLabel');
  const bgPanY = document.getElementById('bgPanY');
  const bgPanYLabel = document.getElementById('bgPanYLabel');

  // Filters
  const brightSlider = document.getElementById('brightSlider');
  const brightLabel = document.getElementById('brightLabel');
  const contrastSlider = document.getElementById('contrastSlider');
  const contrastLabel = document.getElementById('contrastLabel');
  const saturateSlider = document.getElementById('saturateSlider');
  const saturateLabel = document.getElementById('saturateLabel');
  const resetFiltersBtn = document.getElementById('resetFiltersBtn');

  // Cutout
  const cutoutInput = document.getElementById('cutoutInput');
  const cutoutScale = document.getElementById('cutoutScale');
  const cutoutScaleLabel = document.getElementById('cutoutScaleLabel');
  const cutoutPosX = document.getElementById('cutoutPosX');
  const cutoutPosXLabel = document.getElementById('cutoutPosXLabel');
  const cutoutPosY = document.getElementById('cutoutPosY');
  const cutoutPosYLabel = document.getElementById('cutoutPosYLabel');
  const cutoutFlipX = document.getElementById('cutoutFlipX');
  const glowColor = document.getElementById('glowColor');
  const glowBlur = document.getElementById('glowBlur');
  const glowBlurLabel = document.getElementById('glowBlurLabel');
  const clearCutoutBtn = document.getElementById('clearCutoutBtn');

  // Text 1
  const textLine1 = document.getElementById('textLine1');
  const fontSize1 = document.getElementById('fontSize1');
  const fontSizeLabel1 = document.getElementById('fontSizeLabel1');
  const fillColor1 = document.getElementById('fillColor1');
  const strokeWidth1 = document.getElementById('strokeWidth1');
  const strokeWidthLabel1 = document.getElementById('strokeWidthLabel1');
  const posX1 = document.getElementById('posX1');
  const posXLabel1 = document.getElementById('posXLabel1');
  const posY1 = document.getElementById('posY1');
  const posYLabel1 = document.getElementById('posYLabel1');
  const angle1 = document.getElementById('angle1');
  const angleLabel1 = document.getElementById('angleLabel1');
  const badgeToggle1 = document.getElementById('badgeToggle1');
  const badgeColor1 = document.getElementById('badgeColor1');

  // Text 2
  const textLine2 = document.getElementById('textLine2');
  const fontSize2 = document.getElementById('fontSize2');
  const fontSizeLabel2 = document.getElementById('fontSizeLabel2');
  const fillColor2 = document.getElementById('fillColor2');
  const strokeWidth2 = document.getElementById('strokeWidth2');
  const strokeWidthLabel2 = document.getElementById('strokeWidthLabel2');
  const posX2 = document.getElementById('posX2');
  const posXLabel2 = document.getElementById('posXLabel2');
  const posY2 = document.getElementById('posY2');
  const posYLabel2 = document.getElementById('posYLabel2');
  const angle2 = document.getElementById('angle2');
  const angleLabel2 = document.getElementById('angleLabel2');
  const badgeToggle2 = document.getElementById('badgeToggle2');
  const badgeColor2 = document.getElementById('badgeColor2');

  let bgImage = null;
  let fgImage = null;

  // File Upload Handlers
  imageInput.addEventListener('change', function() {
    if (!this.files || !this.files[0]) return;
    const file = this.files[0];
    log(`Reading background: ${file.name}...`);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        bgImage = img;
        bgPanX.value = 50;
        bgPanY.value = 50;
        bgZoom.value = 100;
        updateLabels();
        log(`Background loaded: ${img.naturalWidth}x${img.naturalHeight}px`);
        renderCanvas(true);
      };
      img.onerror = () => log("Could not decode background image.");
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  cutoutInput.addEventListener('change', function() {
    if (!this.files || !this.files[0]) return;
    const file = this.files[0];
    log(`Reading cutout: ${file.name}...`);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        fgImage = img;
        log(`Cutout loaded: ${img.naturalWidth}x${img.naturalHeight}px`);
        renderCanvas(true);
      };
      img.onerror = () => log("Could not decode cutout image.");
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  clearCutoutBtn.addEventListener('click', () => {
    fgImage = null;
    cutoutInput.value = '';
    log("Cutout cleared.");
    renderCanvas(true);
  });

  // Mouse Drag-To-Pan
  let isDragging = false;
  let startX = 0, startY = 0;

  canvas.addEventListener('mousedown', (e) => {
    if (!bgImage) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging || !bgImage) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    startX = e.clientX;
    startY = e.clientY;

    let px = parseFloat(bgPanX.value) - (dx * 0.15);
    let py = parseFloat(bgPanY.value) - (dy * 0.15);
    bgPanX.value = Math.max(0, Math.min(100, px));
    bgPanY.value = Math.max(0, Math.min(100, py));
    updateLabels();
    renderCanvas(true);
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  function updateLabels() {
    bgZoomLabel.textContent = `${bgZoom.value}%`;
    bgPanXLabel.textContent = `${Math.round(bgPanX.value)}%`;
    bgPanYLabel.textContent = `${Math.round(bgPanY.value)}%`;
    brightLabel.textContent = `${brightSlider.value}%`;
    contrastLabel.textContent = `${contrastSlider.value}%`;
    saturateLabel.textContent = `${saturateSlider.value}%`;
    cutoutScaleLabel.textContent = `${cutoutScale.value}%`;
    cutoutPosXLabel.textContent = `${cutoutPosX.value}%`;
    cutoutPosYLabel.textContent = `${cutoutPosY.value}%`;
    glowBlurLabel.textContent = `${glowBlur.value}px`;
    fontSizeLabel1.textContent = `${fontSize1.value}px`;
    strokeWidthLabel1.textContent = `${strokeWidth1.value}px`;
    posXLabel1.textContent = `${posX1.value}%`;
    posYLabel1.textContent = `${posY1.value}%`;
    angleLabel1.textContent = `${angle1.value}°`;
    fontSizeLabel2.textContent = `${fontSize2.value}px`;
    strokeWidthLabel2.textContent = `${strokeWidth2.value}px`;
    posXLabel2.textContent = `${posX2.value}%`;
    posYLabel2.textContent = `${posY2.value}%`;
    angleLabel2.textContent = `${angle2.value}°`;
  }

  const allInputs = [
    resPreset, safeZoneToggle, bgZoom, bgPanX, bgPanY,
    brightSlider, contrastSlider, saturateSlider,
    cutoutScale, cutoutPosX, cutoutPosY, cutoutFlipX, glowColor, glowBlur,
    textLine1, fontSize1, fillColor1, strokeWidth1, posX1, posY1, angle1, badgeToggle1, badgeColor1,
    textLine2, fontSize2, fillColor2, strokeWidth2, posX2, posY2, angle2, badgeToggle2, badgeColor2
  ];

  allInputs.forEach(input => {
    input.addEventListener('input', () => { updateLabels(); renderCanvas(true); });
    input.addEventListener('change', () => { updateLabels(); renderCanvas(true); });
  });

  resetFiltersBtn.addEventListener('click', () => {
    brightSlider.value = 100; contrastSlider.value = 100; saturateSlider.value = 100;
    updateLabels();
    renderCanvas(true);
  });

  // Master Render Engine (Guaranteed Safe Coordinate Clamping)
  function renderCanvas(includeGuide = true) {
    const [w, h] = resPreset.value.split('x').map(Number);
    canvas.width = w;
    canvas.height = h;
    resVal.textContent = `${w} × ${h}`;

    // 1. Draw Canvas Background
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, w, h);

    // 2. Draw Background Image with Bulletproof Bounds
    if (bgImage && bgImage.complete && bgImage.naturalWidth > 0 && bgImage.naturalHeight > 0) {
      try {
        ctx.save();
        ctx.filter = `brightness(${brightSlider.value}%) contrast(${contrastSlider.value}%) saturate(${saturateSlider.value}%)`;

        const imgW = bgImage.naturalWidth;
        const imgH = bgImage.naturalHeight;
        const targetAspect = w / h;
        const imgAspect = imgW / imgH;

        let baseCropW, baseCropH;
        if (imgAspect > targetAspect) {
          baseCropH = imgH;
          baseCropW = imgH * targetAspect;
        } else {
          baseCropW = imgW;
          baseCropH = imgW / targetAspect;
        }

        const zoom = Math.max(1, parseFloat(bgZoom.value) / 100);
        let cropW = Math.floor(baseCropW / zoom);
        let cropH = Math.floor(baseCropH / zoom);

        // Clamping to ensure parameters never exceed physical image dimensions
        cropW = Math.min(imgW, Math.max(10, cropW));
        cropH = Math.min(imgH, Math.max(10, cropH));

        const maxPanX = Math.max(0, imgW - cropW);
        const maxPanY = Math.max(0, imgH - cropH);

        let cropX = Math.floor(maxPanX * (parseFloat(bgPanX.value) / 100));
        let cropY = Math.floor(maxPanY * (parseFloat(bgPanY.value) / 100));

        // Hard boundary protection against IndexSizeError
        if (cropX + cropW > imgW) cropX = imgW - cropW;
        if (cropY + cropH > imgH) cropY = imgH - cropH;
        if (cropX < 0) cropX = 0;
        if (cropY < 0) cropY = 0;

        ctx.drawImage(bgImage, cropX, cropY, cropW, cropH, 0, 0, w, h);
        ctx.restore();
      } catch (err) {
        log(`Background draw warning: ${err.message}`);
        // Fallback: draw directly without crop if any math anomaly occurs
        ctx.drawImage(bgImage, 0, 0, w, h);
      }
    } else {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#475569';
      ctx.font = `bold 28px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SELECT A BACKGROUND IMAGE', w / 2, h / 2);
    }

    // 3. Draw Cutout Subject
    if (fgImage && fgImage.complete && fgImage.naturalWidth > 0 && fgImage.naturalHeight > 0) {
      try {
        ctx.save();
        const sFactor = (parseFloat(cutoutScale.value) / 100) * (h / fgImage.naturalHeight);
        const cw = Math.max(1, Math.round(fgImage.naturalWidth * sFactor));
        const ch = Math.max(1, Math.round(fgImage.naturalHeight * sFactor));
        const cx = (w * parseFloat(cutoutPosX.value)) / 100;
        const cy = (h * parseFloat(cutoutPosY.value)) / 100;

        ctx.translate(cx, cy);
        if (cutoutFlipX.checked) ctx.scale(-1, 1);

        const blur = parseFloat(glowBlur.value);
        if (blur > 0) {
          ctx.save();
          ctx.shadowColor = glowColor.value;
          ctx.shadowBlur = blur * (w / 1280);
          ctx.drawImage(fgImage, -cw / 2, -ch / 2, cw, ch);
          ctx.restore();
        }
        ctx.drawImage(fgImage, -cw / 2, -ch / 2, cw, ch);
        ctx.restore();
      } catch (fgErr) {
        log(`Cutout warning: ${fgErr.message}`);
      }
    }

    // 4. Draw Headlines
    const scale = w / 1280;
    if (textLine1.value.trim().length > 0) {
      drawText(textLine1.value.trim(), fontSize1.value, strokeWidth1.value, fillColor1.value, posX1.value, posY1.value, angle1.value, badgeToggle1.checked, badgeColor1.value, scale, w, h);
    }
    if (textLine2.value.trim().length > 0) {
      drawText(textLine2.value.trim(), fontSize2.value, strokeWidth2.value, fillColor2.value, posX2.value, posY2.value, angle2.value, badgeToggle2.checked, badgeColor2.value, scale, w, h);
    }

    // 5. Safe-Zone UI Guide
    if (includeGuide && safeZoneToggle.checked) {
      drawGuide(w, h);
    }

    // 6. Update File Size Safely
    try {
      canvas.toBlob((blob) => {
        if (blob) sizeVal.textContent = `${(blob.size / 1024).toFixed(1)} KB`;
      }, 'image/jpeg', 0.90);
    } catch (bErr) {
      sizeVal.textContent = "N/A";
    }
  }

  function drawText(text, size, stroke, color, px, py, angle, badge, badgeCol, scale, w, h) {
    ctx.save();
    const finalSize = parseFloat(size) * scale;
    const finalStroke = parseFloat(stroke) * scale;
    const x = (w * parseFloat(px)) / 100;
    const y = (h * parseFloat(py)) / 100;

    ctx.translate(x, y);
    ctx.rotate((parseFloat(angle) * Math.PI) / 180);
    ctx.font = `900 ${finalSize}px Impact, -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const pad = 14 * scale;
    if (badge) {
      const tw = ctx.measureText(text).width;
      const th = finalSize * 0.9;
      ctx.fillStyle = badgeCol;
      ctx.fillRect(-tw / 2 - pad, -th / 2 - pad * 0.7, tw + pad * 2, th + pad * 1.4);
    }

    if (finalStroke > 0) {
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = finalStroke;
      ctx.lineJoin = 'round';
      ctx.strokeText(text, 0, 0);
    }

    ctx.fillStyle = color;
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function drawGuide(w, h) {
    const s = w / 1280;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(w - (105 * s), h - (46 * s), 90 * s, 32 * s);
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${16 * s}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('12:45', w - (60 * s), h - (30 * s));

    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 2 * s;
    ctx.setLineDash([8 * s, 6 * s]);
    ctx.strokeRect(20 * s, 20 * s, w - 40 * s, h - 40 * s);
    ctx.restore();
  }

  downloadBtn.addEventListener('click', () => {
    renderCanvas(false);
    const link = document.createElement('a');
    link.download = `thumbnail_${canvas.width}x${canvas.height}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.90);
    link.click();
    renderCanvas(true);
  });

  // Render instantly on page open
  renderCanvas(true);
</script>
</body>
</html>
